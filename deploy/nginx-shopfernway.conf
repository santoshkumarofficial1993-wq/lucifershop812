# Fernway — nginx site config (static site, behind Cloudflare, Full (strict) SSL)
# Install to: /etc/nginx/sites-available/shopfernway.us
# then: ln -s /etc/nginx/sites-available/shopfernway.us /etc/nginx/sites-enabled/
#
# Assumes a Cloudflare Origin Certificate installed at:
#   /etc/ssl/cloudflare/shopfernway.us.pem   (certificate)
#   /etc/ssl/cloudflare/shopfernway.us.key   (private key)

# HTTP :80 -> redirect everything to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name shopfernway.us www.shopfernway.us;
    return 301 https://shopfernway.us$request_uri;
}

# HTTPS :443
# Note: "listen ... ssl http2" is the syntax for nginx < 1.25 (Ubuntu 22.04 ships
# 1.18). On nginx 1.25+ you can instead use "listen 443 ssl;" plus "http2 on;".
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shopfernway.us www.shopfernway.us;

    ssl_certificate     /etc/ssl/cloudflare/shopfernway.us.pem;
    ssl_certificate_key /etc/ssl/cloudflare/shopfernway.us.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Normalise www -> apex
    if ($host = www.shopfernway.us) { return 301 https://shopfernway.us$request_uri; }

    root /var/www/shopfernway.us;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long cache for fingerprint-stable assets (images, fonts, css, js)
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|woff2|css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Pages
    location / {
        try_files $uri $uri/ =404;
    }

    # Don't serve dotfiles or the source maps/notes if any slip in
    location ~ /\.(?!well-known) { deny all; }

    # ---- OPTIONAL: US-only backup at the origin --------------------------------
    # The real geo-block is the Cloudflare WAF rule. This is a belt-and-suspenders
    # copy using Cloudflare's country header. To enable, also add the http{} map in
    # DEPLOY-SSH.md, then uncomment:
    #   if ($allow_us = 0) { return 403; }
}
